problem_class: max_cut
iterations: 50 # 1,50
base_seed: 10
num_seeds: 1  # 10

max_cut:
  graph_type: fully_connected
  nodes: 12
  max_weight: 10

vqe_parameters:
  ansatz_type: [HEA_1,HEA_2,HEA_3]
  ansatz_layers: [1,3,5]
  entangle_method: 'parametrize'    # Options: none, dropout, parametrize
  dropout_ratio: 0 # [0,0.2,0.4,0.6,0.8]
  param_theta: [np.pi/2, np.pi/4, np.pi/8]
  optimizer: SPSA               # Options: COBYLA, SPSA

eval:
  ent_cap: False
  expressibility: False
  expr_plot: False
  qpic: False
