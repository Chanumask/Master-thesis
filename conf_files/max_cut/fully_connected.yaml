problem_class: max_cut
iterations: 50 # how many runs using the same seed
base_seed: 42
num_seeds: 1

max_cut:
  graph_type: fully_connected
  nodes: 8
  max_weight: 10

vqe_parameters:
  ansatz_type: [HEA_1, HEA_2, HEA_3]
  ansatz_layers: [1,2,3,4,5,6,7]
  plot_ansatz: True

  entangle_method: 'none' # Options: none, dropout, parametrize
  dropout_ratio: 0.2  # probability to remove cx/cz gates
  param_theta: np.pi/2

  optimizer: SPSA            # Options: COBYLA, SPSA, NELDER_MEAD
