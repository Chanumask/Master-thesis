problem_class: max_cut
iterations: 20 # how many runs using the same seed
base_seed: 42
num_seeds: 1

max_cut:
  graph_type: fully_connected
  nodes: 10
  max_weight: 10

vqe_parameters:
  ansatz_type: HEA  # Options: RealAmplitudes, EfficientSU2, HEA, Test
  ansatz_layers: [1,3,5,7,9]
  plot_ansatz: True

  entangle_method: 'none' # Options: none, dropout, parametrize
  dropout_ratio: 0.5  # probability to keep cx/cz gates
  param_theta: np.pi/2

  optimizer: COBYLA            # Options: COBYLA, SPSA, NELDER_MEAD
