problem_class: max_cut
iterations: 5 # 50   erstmal zeitlich antesten 5
base_seed: 10
num_seeds: 1  # 10

max_cut:
  graph_type: fully_connected
  nodes: 8    # [8,10,12,14,16] measure wallclock time
  max_weight: 10

vqe_parameters:
  ansatz_type: [HEA_1,HEA_2,HEA_3]  # add single-rotation and decide on one double-rotation, maybe add more?
  ansatz_layers: 1 # [1,3,5]
  entangle_method: 'none'          # Options: none, dropout, parametrize
  dropout_ratio: 0 # [0,0.2,0.4,0.6,0.8]    # probability to remove cx/cz gates
  param_theta: 0 # np.pi/2                # [np.pi/2, np.pi/4, np.pi/8] symmetric
  optimizer: COBYLA                    # Options: COBYLA, SPSA

eval:
  ent_cap: True
  expressibility: True
  qpic: False
