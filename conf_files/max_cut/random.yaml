problem_class: max_cut
iterations: 20 # how many runs using the same seed
base_seed: 42
num_seeds: 1

max_cut:
  graph_type: random  # Options: random, fully_connected, n-regular.yaml
  nodes: 8
  connectivity: 0.8
  max_weight: 10

vqe_parameters:
  ansatz_type: HEA_1
  ansatz_layers: [1,3,5,7,9]
  plot_ansatz: True

  entangle_method: 'dropout' # Options: dropout, parametrize
  dropout_ratio: 0.5
  param_theta: np.pi/2

  optimizer: COBYLA            # Options: COBYLA, SPSA, NELDER_MEAD
